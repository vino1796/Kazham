<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAZHAM — Read the game. Render the moment.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --charcoal: #0D0A08;
    --charcoal-raise: #17120E;
    --clay: #C1613A;
    --clay-deep: #8B4226;
    --sand: #E8D5B7;
    --copper: #D9A356;
    --line: rgba(232,213,183,0.14);
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height: 100%; overflow: hidden; }
  body{
    background: var(--charcoal); color: var(--sand);
    font-family: 'Jost', sans-serif; font-weight: 300;
    position: relative;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

  /* ================= STAGE ================= */
  .stage{ position: fixed; inset: 0; }

  /* ---- background scene layers ---- */
  .scene-layer{
    position: absolute; inset: 0; opacity: 0;
    display: flex; align-items: center; justify-content: center;
    transform: scale(1.06);
  }
  .scene-layer svg{ width: 100%; height: 100%; }
  .vignette{
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(13,10,8,0.15) 0%, rgba(13,10,8,0.75) 72%, rgba(13,10,8,0.96) 100%);
  }
  .grain-tint{
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(13,10,8,0.55) 0%, rgba(13,10,8,0.15) 30%, rgba(13,10,8,0.15) 65%, rgba(13,10,8,0.75) 100%);
  }

  /* ---- hero content ---- */
  .hero{
    position: relative; z-index: 5; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 6vw;
  }
  .title-wrap{ overflow: visible; }
  .title{
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4.2rem, 15vw, 10rem);
    letter-spacing: 0.06em;
    color: var(--sand);
    line-height: 1;
    display: flex;
    justify-content: center;
  }
  .title span{
    display: inline-block;
    opacity: 0;
    filter: blur(14px);
    transform: translateY(18px) scale(1.15);
  }
  .title-underline{
    width: 0; height: 2px; margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, var(--copper), transparent);
  }

  .tagline{
    font-family: 'Jost', sans-serif; font-weight: 200;
    font-size: clamp(0.95rem, 1.8vw, 1.35rem);
    letter-spacing: 0.08em;
    color: var(--sand);
    opacity: 0.88;
    margin-top: 26px;
    display: flex; gap: 0.4em; flex-wrap: wrap; justify-content: center;
  }
  .tagline span{ opacity: 0; transform: translateY(10px); display:inline-block; }

  .cta-row{
    display: flex; align-items: center; gap: 30px;
    margin-top: 56px;
  }
  .cta-row .cta-item{ opacity: 0; transform: translateY(14px); }

  .cta-link{
    position: relative; font-family: 'Jost', sans-serif; font-weight: 400;
    font-size: 0.98rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--sand); background: none; border: none; cursor: pointer;
    padding: 10px 4px;
  }
  .cta-link::after{
    content:''; position:absolute; left:0; bottom:4px; height:1px; width:100%;
    background: var(--copper); transform: scaleX(0); transform-origin: left;
    transition: transform 0.45s cubic-bezier(.22,1,.36,1);
  }
  .cta-link:hover::after{ transform: scaleX(1); }
  .cta-link:hover{ color: var(--copper); }
  .cta-link.primary{
    border: 1px solid var(--line); border-radius: 2px; padding: 13px 34px;
    transition: border-color 0.4s ease, box-shadow 0.4s ease, color 0.4s ease;
  }
  .cta-link.primary::after{ display:none; }
  .cta-link.primary:hover{
    border-color: var(--copper); color: var(--copper);
    box-shadow: 0 0 26px rgba(217,163,86,0.28);
  }

  .divider-dot{ width: 3px; height: 3px; border-radius: 50%; background: var(--line); opacity: 0; }

  .admin-link{
    position: fixed; bottom: 26px; right: 32px; z-index: 6;
    font-size: 0.7rem; letter-spacing: 0.1em; color: rgba(232,213,183,0.38);
    background: none; border: none; cursor: pointer; text-transform: uppercase;
    opacity: 0; transition: color 0.3s ease;
  }
  .admin-link:hover{ color: rgba(232,213,183,0.75); }

  .brand-mark{
    position: fixed; top: 30px; left: 34px; z-index: 6;
    font-family: 'Bebas Neue'; letter-spacing: 0.08em; font-size: 1rem;
    color: rgba(232,213,183,0.5); opacity: 0;
  }

  /* ================= AUTH PANELS ================= */
  .panel-backdrop{
    position: fixed; inset: 0; z-index: 30;
    background: rgba(13,10,8,0.7); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
  }
  .panel-backdrop.open{ pointer-events: auto; }

  .auth-panel{
    width: 100%; max-width: 400px; margin: 0 24px;
    background: var(--charcoal-raise);
    border: 1px solid var(--line);
    padding: 46px 40px;
    position: relative;
    transform: translateY(30px); opacity: 0;
  }
  .auth-panel.admin-panel{
    border-color: rgba(232,213,183,0.22);
  }
  .auth-panel.admin-panel .auth-title{ color: var(--sand); }
  .auth-panel.admin-panel .field input:focus{ border-color: var(--sand); }
  .auth-panel.admin-panel .submit-btn{ background: var(--sand); color: var(--charcoal); }
  .auth-panel.admin-panel .submit-btn:hover{ background: #fff; }

  .close-panel{
    position: absolute; top: 18px; right: 18px;
    background: none; border: none; color: var(--sand); opacity: 0.5;
    font-size: 1.3rem; cursor: pointer; line-height: 1; padding: 6px;
  }
  .close-panel:hover{ opacity: 1; }

  .auth-kicker{
    font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--copper); margin-bottom: 10px;
  }
  .auth-title{
    font-family: 'Bebas Neue'; font-size: 2.1rem; letter-spacing: 0.03em;
    color: var(--clay); margin-bottom: 30px;
  }

  .field{ margin-bottom: 20px; }
  .field label{
    display:block; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(232,213,183,0.55); margin-bottom: 8px;
  }
  .field input{
    width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line);
    color: var(--sand); font-family: 'Jost'; font-size: 0.95rem; padding: 8px 2px;
    transition: border-color 0.3s ease;
  }
  .field input:focus{ outline: none; border-color: var(--copper); }
  .field-error{ font-size: 0.72rem; color: #d98a6e; margin-top: 6px; min-height: 1em; }

  .submit-btn{
    width: 100%; margin-top: 10px; padding: 13px; border: none;
    background: var(--copper); color: var(--charcoal); font-family:'Jost'; font-weight: 500;
    font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    transition: background 0.3s ease, transform 0.15s ease;
  }
  .submit-btn:hover{ background: #e7b876; }
  .submit-btn:active{ transform: scale(0.98); }
  .submit-btn:disabled{ opacity: 0.6; cursor: default; transform:none; }

  .switch-line{
    text-align: center; margin-top: 24px; font-size: 0.82rem; color: rgba(232,213,183,0.55);
  }
  .switch-line button{ background:none; border:none; color: var(--copper); cursor:pointer; font: inherit; padding:0; }
  .switch-line button:hover{ text-decoration: underline; }

  /* welcome / access-granted screen */
  .access-screen{
    position: fixed; inset:0; z-index: 40; background: var(--charcoal);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    opacity: 0; pointer-events:none; text-align:center;
  }
  .access-screen.open{ pointer-events:auto; }
  .access-screen .ak{ font-family:'Bebas Neue'; font-size: clamp(2.4rem,6vw,3.6rem); letter-spacing: 0.05em; color: var(--clay); }
  .access-screen p{ margin-top: 14px; color: rgba(232,213,183,0.6); font-size: 0.9rem; letter-spacing: 0.04em; }
  .access-screen button{
    margin-top: 40px; background:none; border: 1px solid var(--line); color: var(--sand);
    padding: 11px 28px; font-family:'Jost'; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; cursor:pointer;
    transition: border-color .3s ease, color .3s ease;
  }
  .access-screen button:hover{ border-color: var(--copper); color: var(--copper); }

  @media (max-width: 560px){
    .cta-row{ gap: 20px; }
    .auth-panel{ padding: 38px 26px; }
  }
</style>
</head>
<body>

<div class="brand-mark" id="brand-mark">KAZHAM</div>

<div class="stage">
  <div class="scene-layer" id="scene-0"></div>
  <div class="scene-layer" id="scene-1"></div>
  <div class="scene-layer" id="scene-2"></div>
  <div class="scene-layer" id="scene-3"></div>
  <div class="grain-tint"></div>
  <div class="vignette"></div>

  <div class="hero">
    <div class="title-wrap">
      <h1 class="title" id="title"></h1>
    </div>
    <div class="title-underline" id="underline"></div>
    <p class="tagline" id="tagline"></p>
    <div class="cta-row">
      <span class="cta-item"><button class="cta-link" id="btn-signin">Sign In</button></span>
      <span class="divider-dot"></span>
      <span class="cta-item"><button class="cta-link primary" id="btn-signup">Sign Up</button></span>
    </div>
  </div>
</div>

<button class="admin-link" id="btn-admin">Administrator Login</button>

<!-- ============ SIGN IN PANEL ============ -->
<div class="panel-backdrop" id="backdrop-signin">
  <div class="auth-panel" id="panel-signin">
    <button class="close-panel" data-close>&times;</button>
    <div class="auth-kicker">Welcome back</div>
    <h2 class="auth-title">Sign In</h2>
    <div class="field-error" id="signin-error" style="margin-bottom:14px;"></div>
    <form id="signin-form" novalidate>
      <div class="field">
        <label for="si-email">Email</label>
        <input type="email" id="si-email" autocomplete="email">
        <div class="field-error" id="si-email-err"></div>
      </div>
      <div class="field">
        <label for="si-password">Password</label>
        <input type="password" id="si-password" autocomplete="current-password">
        <div class="field-error" id="si-password-err"></div>
      </div>
      <button type="submit" class="submit-btn" id="si-submit">Enter Kazham</button>
    </form>
    <div class="switch-line">New here? <button data-switch-to="signup">Create an account</button></div>
  </div>
</div>

<!-- ============ SIGN UP PANEL ============ -->
<div class="panel-backdrop" id="backdrop-signup">
  <div class="auth-panel" id="panel-signup">
    <button class="close-panel" data-close>&times;</button>
    <div class="auth-kicker">Join the platform</div>
    <h2 class="auth-title">Sign Up</h2>
    <div class="field-error" id="signup-error" style="margin-bottom:14px;"></div>
    <form id="signup-form" novalidate>
      <div class="field">
        <label for="su-name">Name</label>
        <input type="text" id="su-name" autocomplete="name">
        <div class="field-error" id="su-name-err"></div>
      </div>
      <div class="field">
        <label for="su-email">Email</label>
        <input type="email" id="su-email" autocomplete="email">
        <div class="field-error" id="su-email-err"></div>
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input type="password" id="su-password" autocomplete="new-password">
        <div class="field-error" id="su-password-err"></div>
      </div>
      <button type="submit" class="submit-btn" id="su-submit">Create Account</button>
    </form>
    <div class="switch-line">Already registered? <button data-switch-to="signin">Sign in</button></div>
  </div>
</div>

<!-- ============ ADMIN PANEL ============ -->
<div class="panel-backdrop" id="backdrop-admin">
  <div class="auth-panel admin-panel" id="panel-admin">
    <button class="close-panel" data-close>&times;</button>
    <div class="auth-kicker" style="color:rgba(232,213,183,0.6);">Restricted access</div>
    <h2 class="auth-title">Administrator</h2>
    <div class="field-error" id="admin-error" style="margin-bottom:14px;"></div>
    <form id="admin-form" novalidate>
      <div class="field">
        <label for="ad-email">Admin email</label>
        <input type="email" id="ad-email" autocomplete="email">
        <div class="field-error" id="ad-email-err"></div>
      </div>
      <div class="field">
        <label for="ad-password">Password</label>
        <input type="password" id="ad-password" autocomplete="current-password">
        <div class="field-error" id="ad-password-err"></div>
      </div>
      <button type="submit" class="submit-btn">Authenticate</button>
    </form>
  </div>
</div>

<!-- ============ ACCESS GRANTED SCREEN ============ -->
<div class="access-screen" id="access-screen">
  <div class="ak" id="access-title">Access Granted</div>
  <p id="access-sub">This is where Kazham's platform would begin.</p>
  <button id="access-back">Return</button>
</div>

<script>
/* ================= BACKGROUND SCENES (self-contained SVG silhouettes) ================= */
const CLAY = '#C1613A';
const CLAY_DEEP = '#8B4226';

const scenes = [
  // Cricket — batsman mid-stroke
  `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs><radialGradient id="g0" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1c140f"/><stop offset="100%" stop-color="#0D0A08"/>
    </radialGradient></defs>
    <rect width="1200" height="800" fill="url(#g0)"/>
    <ellipse cx="600" cy="760" rx="520" ry="26" fill="${CLAY_DEEP}" opacity="0.25"/>
    <g fill="${CLAY}" opacity="0.9">
      <path d="M600 250 C 610 250 618 262 616 278 L 608 340 C 640 356 668 380 690 412 L 660 434 C 636 404 606 382 578 368 L 560 470 L 600 620 L 574 626 L 540 480 L 500 560 L 478 550 L 522 452 L 540 350 C 520 344 502 336 486 324 L 506 296 C 522 306 540 314 558 318 L 566 278 C 562 262 570 250 600 250 Z"/>
      <rect x="670" y="380" width="150" height="16" rx="6" transform="rotate(28 670 380)"/>
    </g>
    <circle cx="835" cy="430" r="9" fill="${CLAY}" opacity="0.85"/>
  </svg>`,
  // Football — kicking silhouette
  `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs><radialGradient id="g1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c140f"/><stop offset="100%" stop-color="#0D0A08"/>
    </radialGradient></defs>
    <rect width="1200" height="800" fill="url(#g1)"/>
    <ellipse cx="600" cy="760" rx="520" ry="26" fill="${CLAY_DEEP}" opacity="0.25"/>
    <g fill="${CLAY}" opacity="0.9">
      <path d="M560 240 c14 0 24 12 22 28 l-8 60 c30 10 54 32 70 62 l16 60 -30 8 -14 -54 c-10 -22 -26 -38 -46 -48 l-26 96 60 40 -16 26 -70 -46 -30 70 -28 -12 34 -78 -10 -110 c-20 6 -38 4 -54 -6 l14 -28 c14 8 28 10 42 6 l4 -66 c-4 -14 6 -28 20 -28 z"/>
    </g>
    <circle cx="470" cy="560" r="22" fill="${CLAY}" opacity="0.85"/>
  </svg>`,
  // Swimmer — diving
  `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs><radialGradient id="g2" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1c140f"/><stop offset="100%" stop-color="#0D0A08"/>
    </radialGradient></defs>
    <rect width="1200" height="800" fill="url(#g2)"/>
    <rect x="0" y="560" width="1200" height="4" fill="${CLAY_DEEP}" opacity="0.35"/>
    <g fill="${CLAY}" opacity="0.9">
      <path d="M420 470 c40 -30 90 -46 150 -46 60 0 120 20 170 10 30 -6 46 -24 66 -24 16 0 26 12 22 26 -4 16 -26 24 -50 26 -56 6 -110 -12 -166 -8 -50 4 -92 18 -124 42 z"/>
      <circle cx="410" cy="466" r="20"/>
    </g>
  </svg>`,
  // Athletics — sprinter
  `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs><radialGradient id="g3" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#1c140f"/><stop offset="100%" stop-color="#0D0A08"/>
    </radialGradient></defs>
    <rect width="1200" height="800" fill="url(#g3)"/>
    <ellipse cx="600" cy="760" rx="520" ry="26" fill="${CLAY_DEEP}" opacity="0.25"/>
    <g fill="${CLAY}" opacity="0.9">
      <path d="M540 240 c14 -2 26 8 26 22 l2 56 c26 14 46 36 58 64 l38 92 -26 12 -34 -84 c-8 -18 -20 -32 -36 -42 l6 90 44 116 -28 10 -46 -116 -10 -78 c-22 8 -42 24 -56 46 l-40 66 -24 -14 44 -74 c16 -26 38 -46 64 -58 l-4 -52 c-2 -14 8 -26 22 -28 z"/>
    </g>
  </svg>`,
];

const layers = [0,1,2,3].map(i => document.getElementById('scene-' + i));
layers.forEach((el,i) => { el.innerHTML = scenes[i]; });
gsap.set(layers[0], { opacity: 1 });

let sceneIndex = 0;
function cycleScene(){
  const next = (sceneIndex + 1) % layers.length;
  gsap.to(layers[sceneIndex], { opacity: 0, scale: 1.12, duration: 2.4, ease: 'power2.inOut' });
  gsap.fromTo(layers[next], { opacity: 0, scale: 1.02 }, { opacity: 1, scale: 1.06, duration: 2.4, ease: 'power2.inOut' });
  sceneIndex = next;
}
setInterval(cycleScene, 6000);

/* subtle parallax on mouse move */
document.addEventListener('mousemove', (e) => {
  const x = (e.clientX / window.innerWidth - 0.5) * 14;
  const y = (e.clientY / window.innerHeight - 0.5) * 14;
  gsap.to('.stage .scene-layer', { x: x, y: y, duration: 1.2, ease: 'power2.out', overwrite: 'auto' });
});

/* ================= TITLE / TAGLINE / CTA REVEAL ================= */
const titleEl = document.getElementById('title');
const word = 'KAZHAM';
titleEl.innerHTML = word.split('').map(ch => `<span>${ch}</span>`).join('');

const taglineEl = document.getElementById('tagline');
const taglineWords = 'Read the game. Render the moment.'.split(' ');
taglineEl.innerHTML = taglineWords.map(w => `<span>${w}</span>`).join(' ');

const tl = gsap.timeline({ delay: 0.3 });
tl.to('#title span', {
  opacity: 1, filter: 'blur(0px)', y: 0, scale: 1,
  duration: 1.1, ease: 'expo.out', stagger: 0.07
})
.to('#underline', { width: '140px', duration: 0.9, ease: 'power3.out' }, '-=0.4')
.to('#tagline span', { opacity: 0.88, y: 0, duration: 0.7, ease: 'power2.out', stagger: 0.06 }, '-=0.3')
.to('.cta-item, .divider-dot', { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out', stagger: 0.12 }, '-=0.2')
.to('#brand-mark', { opacity: 1, duration: 0.8, ease: 'power1.out' }, '-=0.5')
.to('#btn-admin', { opacity: 1, duration: 0.8, ease: 'power1.out' }, '-=0.5');

/* ================= AUTH PANELS ================= */
function openPanel(name){
  const backdrop = document.getElementById('backdrop-' + name);
  const panel = document.getElementById('panel-' + name);
  backdrop.classList.add('open');
  gsap.to(backdrop, { opacity: 1, duration: 0.4, ease: 'power2.out' });
  gsap.fromTo(panel, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out', delay: 0.05 });
}
function closePanel(name){
  const backdrop = document.getElementById('backdrop-' + name);
  const panel = document.getElementById('panel-' + name);
  gsap.to(panel, { y: 16, opacity: 0, duration: 0.3, ease: 'power2.in' });
  gsap.to(backdrop, { opacity: 0, duration: 0.35, ease: 'power2.in', delay: 0.05, onComplete: () => backdrop.classList.remove('open') });
}

document.getElementById('btn-signin').addEventListener('click', () => openPanel('signin'));
document.getElementById('btn-signup').addEventListener('click', () => openPanel('signup'));
document.getElementById('btn-admin').addEventListener('click', () => openPanel('admin'));

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => {
    const panelName = btn.closest('.auth-panel').id.replace('panel-', '');
    closePanel(panelName);
  });
});
document.querySelectorAll('[data-switch-to]').forEach(btn => {
  btn.addEventListener('click', () => {
    const current = btn.closest('.auth-panel').id.replace('panel-', '');
    const target = btn.dataset.switchTo;
    closePanel(current);
    setTimeout(() => openPanel(target), 300);
  });
});
[['backdrop-signin','signin'], ['backdrop-signup','signup'], ['backdrop-admin','admin']].forEach(([bid, name]) => {
  document.getElementById(bid).addEventListener('click', (e) => {
    if(e.target.id === bid) closePanel(name);
  });
});

/* ================= VALIDATION + MOCK SUBMIT ================= */
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function setErr(id, msg){ document.getElementById(id).textContent = msg || ''; }

function showAccess(title, sub, then){
  const screen = document.getElementById('access-screen');
  document.getElementById('access-title').textContent = title;
  document.getElementById('access-sub').textContent = sub;
  screen.classList.add('open');
  gsap.fromTo(screen, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' });
}
document.getElementById('access-back').addEventListener('click', () => {
  const screen = document.getElementById('access-screen');
  gsap.to(screen, { opacity: 0, duration: 0.4, ease: 'power2.in', onComplete: () => screen.classList.remove('open') });
});

document.getElementById('signin-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('si-email').value.trim();
  const password = document.getElementById('si-password').value;
  let ok = true;
  if(!isValidEmail(email)){ setErr('si-email-err','Enter a valid email address.'); ok=false; } else setErr('si-email-err','');
  if(!password){ setErr('si-password-err','Enter your password.'); ok=false; } else setErr('si-password-err','');
  if(!ok) return;
  closePanel('signin');
  setTimeout(() => showAccess('Welcome Back', 'Signed in — this is a demo, no account system is connected yet.'), 350);
});

document.getElementById('signup-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  let ok = true;
  if(!name){ setErr('su-name-err','Enter your name.'); ok=false; } else setErr('su-name-err','');
  if(!isValidEmail(email)){ setErr('su-email-err','Enter a valid email address.'); ok=false; } else setErr('su-email-err','');
  if(password.length < 8){ setErr('su-password-err','Use at least 8 characters.'); ok=false; } else setErr('su-password-err','');
  if(!ok) return;
  closePanel('signup');
  setTimeout(() => showAccess('Account Created', `Welcome to Kazham, ${name.split(' ')[0]} — this is a demo, no account is actually stored.`), 350);
});

document.getElementById('admin-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('ad-email').value.trim();
  const password = document.getElementById('ad-password').value;
  let ok = true;
  if(!isValidEmail(email)){ setErr('ad-email-err','Enter a valid email address.'); ok=false; } else setErr('ad-email-err','');
  if(!password){ setErr('ad-password-err','Enter the administrator password.'); ok=false; } else setErr('ad-password-err','');
  if(!ok) return;
  closePanel('admin');
  setTimeout(() => showAccess('Admin Access', 'Authenticated — this is a demo, no admin backend is connected yet.'), 350);
});
</script>
