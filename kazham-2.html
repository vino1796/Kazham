<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAZHAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0b0a09;
    --clay-deep:#3e2a1e;
    --sienna:#a6512f;
    --terracotta:#c97c4e;
    --sandstone:#e4c9a0;
    --copper:#c99a4e;
    --line: rgba(228,201,160,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--void);
    overflow:hidden;
    font-family:'Jost',sans-serif;
  }
  body{
    position:relative;
    width:100vw;
    height:100vh;
    color:var(--sandstone);
  }

  /* ---------- BACKGROUND SCENE ---------- */
  #scene{
    position:absolute;
    inset:0;
    z-index:1;
    overflow:hidden;
  }
  #scene::after{
    /* vignette + grain-ish darkening for cinematic depth */
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse at center, rgba(11,10,9,0) 0%, rgba(11,10,9,0.55) 62%, rgba(11,10,9,0.96) 100%);
    pointer-events:none;
    z-index:5;
  }
  .layer{
    position:absolute;
    inset:-6%;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    will-change: opacity, transform;
  }
  .layer svg{
    width:100%;
    height:100%;
  }
  /* classy line-drawing treatment: thin single-weight strokes, not solid silhouettes */
  .line-figure{
    fill:none;
    stroke: var(--sandstone);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.9;
  }
  .line-figure-accent{
    fill:none;
    stroke: var(--copper);
    stroke-width: 1.1;
    stroke-linecap: round;
    opacity: 0.85;
  }
  .line-dim{
    fill:none;
    stroke: var(--sienna);
    stroke-width: 1;
    opacity: 0.4;
  }
  .line-dot{ fill: var(--copper); opacity:0.9; }

  /* small sweeping accent line — the "classy" signature motif that traces across on every transition */
  #sweep-line{
    position:absolute;
    inset:0;
    z-index:6;
    pointer-events:none;
  }
  #sweep-line line{
    stroke: var(--copper);
    stroke-width: 1;
    opacity: 0;
  }

  /* ---------- CENTER CONTENT ---------- */
  #stage{
    position:relative;
    z-index:10;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 24px;
  }

  #wordmark{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:900;
    font-size:clamp(64px, 13vw, 168px);
    letter-spacing:0.04em;
    line-height:0.9;
    color:var(--sandstone);
    display:flex;
    overflow:visible;
  }
  #wordmark span{
    display:inline-block;
    opacity:0;
    transform: translateY(0.6em);
    filter: blur(6px);
  }

  #tagline{
    margin-top: clamp(10px, 2vw, 22px);
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight:300;
    font-size: clamp(16px, 2.1vw, 26px);
    letter-spacing:0.06em;
    color: var(--terracotta);
    opacity:0;
  }
  #tagline .char{ opacity:0; }

  #cta-row{
    margin-top: clamp(38px, 6vw, 64px);
    display:flex;
    align-items:center;
    gap: clamp(18px, 3vw, 34px);
    opacity:0;
    transform: translateY(10px);
  }

  .btn{
    position:relative;
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:0.12em;
    color: var(--sandstone);
    background:transparent;
    border:1px solid var(--line);
    padding:15px 38px;
    cursor:pointer;
    transition: border-color .5s cubic-bezier(.19,1,.22,1), color .5s cubic-bezier(.19,1,.22,1), transform .4s cubic-bezier(.19,1,.22,1);
    text-transform:none;
  }
  .btn::after{
    content:"";
    position:absolute;
    left:50%; bottom:0;
    width:0%; height:1px;
    background: var(--copper);
    transition: width .5s cubic-bezier(.19,1,.22,1), left .5s cubic-bezier(.19,1,.22,1);
  }
  .btn:hover{
    border-color: rgba(201,154,78,0.6);
    color: var(--copper);
    transform: translateY(-1px);
  }
  .btn:hover::after{ width:100%; left:0%; }

  .btn-primary{
    background: linear-gradient(180deg, rgba(201,124,78,0.14), rgba(201,124,78,0.05));
    border-color: rgba(201,124,78,0.45);
  }
  .btn-primary:hover{
    box-shadow: 0 0 26px rgba(201,154,78,0.25);
    border-color: var(--copper);
  }

  #admin-link{
    position:absolute;
    right: clamp(16px, 3vw, 34px);
    bottom: clamp(16px, 3vw, 26px);
    z-index:10;
    font-family:'Jost', sans-serif;
    font-weight:300;
    font-size:11px;
    letter-spacing:0.14em;
    color: rgba(228,201,160,0.38);
    text-decoration:none;
    opacity:0;
    transition: color .45s ease, letter-spacing .45s ease;
    cursor:pointer;
    background:none;
    border:none;
  }
  #admin-link:hover{
    color: rgba(228,201,160,0.78);
    letter-spacing:0.19em;
  }

  #mark-glyph{
    position:absolute;
    top: clamp(20px, 3.4vw, 34px);
    left: clamp(20px, 3.4vw, 34px);
    z-index:10;
    width:26px; height:26px;
    opacity:0;
  }

  /* ---------- AUTH PANELS ---------- */
  .panel-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(11,10,9,0.78);
    backdrop-filter: blur(6px);
    opacity:0;
    pointer-events:none;
  }
  .panel-overlay.admin-overlay{
    background: rgba(11,10,9,0.9);
  }
  .panel{
    position:relative;
    width:min(400px, 88vw);
    padding: clamp(34px,5vw,52px) clamp(30px,4vw,44px);
    background: linear-gradient(180deg, rgba(62,42,30,0.42), rgba(11,10,9,0.7));
    border: 1px solid var(--line);
    transform: translateY(24px) scale(0.97);
  }
  .admin-overlay .panel{
    border-color: rgba(201,154,78,0.35);
    background: linear-gradient(180deg, rgba(62,42,30,0.55), rgba(11,10,9,0.85));
  }
  .panel-close{
    position:absolute;
    top:18px; right:18px;
    background:none; border:none;
    color: rgba(228,201,160,0.5);
    font-size:20px;
    cursor:pointer;
    line-height:1;
    transition: color .3s ease, transform .3s ease;
  }
  .panel-close:hover{ color: var(--copper); transform: rotate(90deg); }

  .panel-eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:300;
    color: var(--terracotta);
    font-size:15px;
    letter-spacing:0.05em;
    margin-bottom:4px;
  }
  .panel-title{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:900;
    font-size:32px;
    letter-spacing:0.03em;
    color: var(--sandstone);
    margin-bottom: 26px;
  }

  .field{
    margin-bottom:18px;
  }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:0.12em;
    color: rgba(228,201,160,0.55);
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color: var(--sandstone);
    font-family:'Jost',sans-serif;
    font-size:15px;
    padding:8px 2px;
    outline:none;
    transition: border-color .4s ease;
  }
  .field input:focus{
    border-color: var(--copper);
  }
  .field input::placeholder{ color: rgba(228,201,160,0.28); }

  .panel .btn-primary{
    width:100%;
    margin-top:8px;
    padding:14px 0;
  }

  .panel-switch{
    margin-top:20px;
    text-align:center;
    font-size:12.5px;
    color: rgba(228,201,160,0.5);
  }
  .panel-switch button{
    background:none; border:none;
    color: var(--terracotta);
    cursor:pointer;
    font-size:12.5px;
    text-decoration:underline;
    text-underline-offset:3px;
    padding:0;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div id="scene">
  <div class="layer" id="layer-cricket"></div>
  <div class="layer" id="layer-football"></div>
  <div class="layer" id="layer-swim"></div>
  <div class="layer" id="layer-athletics"></div>
  <div class="layer" id="layer-tennis"></div>
  <div class="layer" id="layer-basketball"></div>
  <svg id="sweep-line" viewBox="0 0 1000 600" preserveAspectRatio="none">
    <line id="sweep-a" x1="0" y1="0" x2="1000" y2="0"/>
    <line id="sweep-b" x1="0" y1="0" x2="0" y2="600"/>
  </svg>
</div>

<svg id="mark-glyph" viewBox="0 0 40 40" fill="none">
  <circle cx="20" cy="20" r="18.5" stroke="#c99a4e" stroke-width="1"/>
  <path d="M13 26 L20 12 L27 26" stroke="#e4c9a0" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
</svg>

<div id="stage">
  <h1 id="wordmark" aria-label="KAZHAM"></h1>
  <p id="tagline"></p>
  <div id="cta-row">
    <button class="btn" id="btn-signin">SIGN IN</button>
    <button class="btn btn-primary" id="btn-signup">SIGN UP</button>
  </div>
</div>

<button id="admin-link">ADMINISTRATOR LOGIN</button>

<!-- SIGN IN -->
<div class="panel-overlay" id="overlay-signin">
  <div class="panel">
    <button class="panel-close" data-close>&times;</button>
    <div class="panel-eyebrow">Welcome back</div>
    <div class="panel-title">SIGN IN</div>
    <div class="field">
      <label>EMAIL</label>
      <input type="email" placeholder="you@broadcast.com">
    </div>
    <div class="field">
      <label>PASSWORD</label>
      <input type="password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary">ENTER</button>
    <div class="panel-switch">New to Kazham? <button data-switch-to="signup">Sign up</button></div>
  </div>
</div>

<!-- SIGN UP -->
<div class="panel-overlay" id="overlay-signup">
  <div class="panel">
    <button class="panel-close" data-close>&times;</button>
    <div class="panel-eyebrow">Get started</div>
    <div class="panel-title">SIGN UP</div>
    <div class="field">
      <label>FULL NAME</label>
      <input type="text" placeholder="Jordan Reyes">
    </div>
    <div class="field">
      <label>EMAIL</label>
      <input type="email" placeholder="you@broadcast.com">
    </div>
    <div class="field">
      <label>PASSWORD</label>
      <input type="password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary">CREATE ACCOUNT</button>
    <div class="panel-switch">Already have an account? <button data-switch-to="signin">Sign in</button></div>
  </div>
</div>

<!-- ADMIN -->
<div class="panel-overlay admin-overlay" id="overlay-admin">
  <div class="panel">
    <button class="panel-close" data-close>&times;</button>
    <div class="panel-eyebrow">Restricted access</div>
    <div class="panel-title">ADMINISTRATOR</div>
    <div class="field">
      <label>ADMIN ID</label>
      <input type="text" placeholder="admin.id">
    </div>
    <div class="field">
      <label>PASSWORD</label>
      <input type="password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary">AUTHENTICATE</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ================= LINE-ART SPORT SCENES ================= */
/* Original single-weight line drawings — not depictions of any real athlete.
   Each scene: one continuous-line figure study + a couple of quiet line/dot accents.
   Paths are drawn on load via stroke-dashoffset for a refined, unhurried feel. */

const svgWrap = (inner) => `<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax slice">${inner}</svg>`;

// CRICKET — batter's stance sketched in one line, stumps as three thin verticals
document.getElementById('layer-cricket').innerHTML = svgWrap(`
  <line class="line-dim" x1="0" y1="472" x2="1000" y2="472"/>
  <path class="line-figure" d="M368 470 C 362 440 366 408 384 386 C 372 378 366 364 372 350 C 360 344 354 328 362 314 C 356 300 362 282 378 276 C 392 270 406 278 410 292 C 424 288 436 296 438 310 C 452 308 462 320 458 334 C 470 340 474 356 464 368 C 474 382 468 402 450 410 C 458 428 452 452 432 462"/>
  <path class="line-figure-accent" d="M432 462 L 520 300"/>
  <circle class="line-dot" cx="530" cy="282" r="4"/>
  <g class="line-dim">
    <line x1="880" y1="382" x2="880" y2="470"/>
    <line x1="900" y1="382" x2="900" y2="470"/>
    <line x1="920" y1="382" x2="920" y2="470"/>
  </g>
`);

// FOOTBALL — a mid-stride kicking figure, ball as a single circle, quiet arc trail
document.getElementById('layer-football').innerHTML = svgWrap(`
  <path class="line-figure" d="M360 470 C 356 442 362 416 380 398 C 366 392 358 376 362 360 C 350 354 344 336 352 322 C 344 306 350 286 366 278 C 380 270 396 276 402 290 C 416 284 430 292 432 306 C 446 302 458 312 456 326 C 472 322 484 334 478 348 C 494 350 502 368 490 380 C 500 396 492 418 472 426 C 476 444 464 462 444 466"/>
  <circle class="line-figure-accent" cx="560" cy="330" r="16"/>
  <path class="line-dim" d="M470 400 Q 520 360 560 330"/>
`);

// SWIMMING — streamlined stroke silhouette over three quiet lane lines
document.getElementById('layer-swim').innerHTML = svgWrap(`
  <g class="line-dim">
    <line x1="0" y1="360" x2="1000" y2="360"/>
    <line x1="0" y1="410" x2="1000" y2="410"/>
    <line x1="0" y1="460" x2="1000" y2="460"/>
  </g>
  <path class="line-figure" d="M140 320 C 200 306 260 306 314 326 C 350 340 380 334 402 312 C 388 308 378 298 376 284 C 390 286 402 280 408 268 C 420 272 434 264 438 250 C 448 262 462 264 472 254"/>
  <circle class="line-dot" cx="486" cy="246" r="3.5"/>
`);

// ATHLETICS — sprinter form, two clean stride lines, lane markers
document.getElementById('layer-athletics').innerHTML = svgWrap(`
  <g class="line-dim">
    <line x1="0" y1="474" x2="1000" y2="474"/>
    <line x1="0" y1="502" x2="1000" y2="502"/>
  </g>
  <path class="line-figure" d="M470 470 C 464 444 458 420 464 396 C 448 402 436 416 432 434 C 420 428 416 412 424 398 C 408 398 396 384 396 368 C 396 352 408 340 424 340 C 420 324 430 310 446 306 C 462 302 476 312 480 328 C 494 322 508 330 510 344"/>
  <path class="line-figure-accent" d="M510 344 L 600 280"/>
  <path class="line-figure-accent" d="M432 434 L 350 384"/>
`);

// TENNIS — serving figure, racquet as an open line arc
document.getElementById('layer-tennis').innerHTML = svgWrap(`
  <line class="line-dim" x1="0" y1="476" x2="1000" y2="476"/>
  <path class="line-figure" d="M420 472 C 416 446 420 420 434 402 C 422 396 416 382 420 368 C 410 362 406 348 412 336 C 404 322 408 304 422 296 C 434 290 448 296 452 310 C 464 306 476 314 476 328 C 488 322 500 330 500 344 C 500 328 512 316 528 316"/>
  <path class="line-figure-accent" d="M528 316 C 540 300 562 298 576 312 C 588 324 586 344 572 354"/>
  <circle class="line-dot" cx="600" cy="298" r="3.5"/>
`);

// BASKETBALL — figure rising for a shot, ball and quiet arc
document.getElementById('layer-basketball').innerHTML = svgWrap(`
  <line class="line-dim" x1="0" y1="478" x2="1000" y2="478"/>
  <path class="line-figure" d="M440 474 C 436 448 442 420 458 400 C 470 386 470 368 458 356 C 468 350 474 336 470 322 C 484 318 494 304 490 290 C 486 274 470 266 456 272 C 444 260 426 260 416 272 C 404 266 388 272 384 286 C 372 288 364 300 368 314 C 356 320 350 336 358 350"/>
  <path class="line-figure-accent" d="M470 322 L 560 260"/>
  <circle class="line-figure-accent" cx="578" cy="248" r="14"/>
  <path class="line-dim" d="M480 400 Q 530 320 578 248"/>
`);

// give every line-drawn path a quiet "draw-in" reveal the first time its scene appears
document.querySelectorAll('.layer svg path, .layer svg circle:not(.line-dot)').forEach(el => {
  if (el.tagName === 'path'){
    try{
      const len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
    }catch(e){}
  }
});

/* ================= INTRO + LOOP SEQUENCE ================= */

// Build wordmark letters
const word = "KAZHAM";
const wordmarkEl = document.getElementById('wordmark');
wordmarkEl.innerHTML = word.split('').map(ch => `<span>${ch}</span>`).join('');
const letters = wordmarkEl.querySelectorAll('span');

// Build tagline chars
const taglineText = "Read the game. Render the moment.";
const taglineEl = document.getElementById('tagline');
taglineEl.innerHTML = taglineText.split('').map(ch =>
  `<span class="char">${ch === ' ' ? '&nbsp;' : ch}</span>`
).join('');
const taglineChars = taglineEl.querySelectorAll('.char');

const layers = ['#layer-cricket', '#layer-football', '#layer-swim', '#layer-athletics', '#layer-tennis', '#layer-basketball'];

function initialLayerState(){
  gsap.set(layers, { opacity: 0, scale: 1.08 });
  gsap.set(layers[0], { opacity: 1, scale: 1.04 });
}

function drawLayerLines(layerSelector){
  const paths = document.querySelectorAll(layerSelector + ' path');
  gsap.fromTo(paths, { strokeDashoffset: (i, el) => el.style.strokeDasharray }, {
    strokeDashoffset: 0,
    duration: 2.2,
    ease: "power2.out",
    stagger: 0.08
  });
}

// the signature "classy" motif: a thin copper line traces across the frame on every transition
function fireSweepLine(){
  const a = document.getElementById('sweep-a');
  const b = document.getElementById('sweep-b');
  gsap.fromTo(a, { attr: { x1: 0, x2: 0 }, opacity: 0.55 }, {
    attr: { x1: 1000, x2: 1000 }, duration: 1.3, ease: "power2.inOut",
    onComplete: () => gsap.to(a, { opacity: 0, duration: 0.4 })
  });
  gsap.fromTo(b, { attr: { y1: 0, y2: 0 }, opacity: 0.35 }, {
    attr: { y1: 600, y2: 600 }, duration: 1.3, ease: "power2.inOut", delay: 0.1,
    onComplete: () => gsap.to(b, { opacity: 0, duration: 0.4 })
  });
}

function startBackgroundLoop(){
  let idx = 0;
  drawLayerLines(layers[0]);
  function cycle(){
    const current = layers[idx];
    const next = layers[(idx + 1) % layers.length];
    fireSweepLine();
    gsap.to(current, { opacity: 0, scale: 1.1, duration: 2.6, ease: "power2.inOut" });
    gsap.fromTo(next, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1.0, duration: 2.6, ease: "power2.inOut" });
    drawLayerLines(next);
    idx = (idx + 1) % layers.length;
  }
  // hold each scene ~5.5s, crossfade 2.6s
  setInterval(cycle, 5500);
}

// subtle parallax on pointer move
function initParallax(){
  const stageDepth = 14;
  window.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5);
    const y = (e.clientY / window.innerHeight - 0.5);
    gsap.to('#scene', { x: -x * stageDepth, y: -y * (stageDepth * 0.6), duration: 1.2, ease: "power2.out" });
    gsap.to('#stage', { x: x * (stageDepth * 0.4), duration: 1.4, ease: "power2.out" });
  });
}

function playIntro(){
  const tl = gsap.timeline({ defaults: { ease: "power4.out" } });

  gsap.set(letters, { opacity: 0, y: 30, filter: "blur(6px)" });
  gsap.set(taglineChars, { opacity: 0 });
  gsap.set('#cta-row', { opacity: 0, y: 10 });
  gsap.set('#admin-link', { opacity: 0 });
  gsap.set('#mark-glyph', { opacity: 0, rotate: -8 });

  tl.to(letters, {
      opacity: 1,
      y: 0,
      filter: "blur(0px)",
      duration: 1.1,
      stagger: 0.09,
      ease: "power3.out"
    })
    .to('#mark-glyph', { opacity: 1, rotate: 0, duration: 1.0, ease: "power2.out" }, "-=0.6")
    .to(taglineChars, {
      opacity: 1,
      duration: 0.02,
      stagger: 0.028,
      ease: "none"
    }, "-=0.25")
    .to('#cta-row', { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, "-=0.15")
    .to('#admin-link', { opacity: 1, duration: 0.9 }, "-=0.5");
}

initialLayerState();
window.addEventListener('load', () => {
  playIntro();
  setTimeout(startBackgroundLoop, 1200);
  initParallax();
});

/* ================= AUTH PANEL LOGIC ================= */
function openPanel(id){
  const overlay = document.getElementById(id);
  overlay.style.pointerEvents = 'auto';
  gsap.to(overlay, { opacity: 1, duration: 0.55, ease: "power2.out" });
  gsap.fromTo(overlay.querySelector('.panel'),
    { y: 24, scale: 0.97 },
    { y: 0, scale: 1, duration: 0.6, ease: "power3.out" }
  );
}
function closePanel(id){
  const overlay = document.getElementById(id);
  gsap.to(overlay, {
    opacity: 0, duration: 0.4, ease: "power2.in",
    onComplete: () => { overlay.style.pointerEvents = 'none'; }
  });
  gsap.to(overlay.querySelector('.panel'), { y: 16, scale: 0.98, duration: 0.4, ease: "power2.in" });
}

document.getElementById('btn-signin').addEventListener('click', () => openPanel('overlay-signin'));
document.getElementById('btn-signup').addEventListener('click', () => openPanel('overlay-signup'));
document.getElementById('admin-link').addEventListener('click', () => openPanel('overlay-admin'));

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const overlay = e.target.closest('.panel-overlay');
    closePanel(overlay.id);
  });
});

document.querySelectorAll('.panel-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closePanel(overlay.id);
  });
});

document.querySelectorAll('[data-switch-to]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const target = e.target.dataset.switchTo;
    const currentOverlay = e.target.closest('.panel-overlay');
    closePanel(currentOverlay.id);
    setTimeout(() => openPanel('overlay-' + target), 350);
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    document.querySelectorAll('.panel-overlay').forEach(o => {
      if (parseFloat(getComputedStyle(o).opacity) > 0) closePanel(o.id);
    });
  }
});
</script>
</body>
</html>
